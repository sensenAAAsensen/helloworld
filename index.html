<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你好世界</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    .card {
      max-width: 560px;
      padding: 40px 56px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    h1 { font-size: 48px; letter-spacing: 1px; margin-bottom: 8px; }
    p  { font-size: 18px; opacity: .9; margin-top: 16px; }
    code {
      background: rgba(0,0,0,.35); padding: 2px 8px; border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>你好世界</h1>
    <p>第一个 GitHub Pages 网页 🎉</p>
    <p>发布于 <code>HTML</code> + <code>CSS</code></p>
  </div>
</body>
</html>
